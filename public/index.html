<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>رفيق القرآن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ea;--cd:#fff;--tx:#1f2d27;--mu:#6b7a72;--g:#0f6b4f;--g2:#e3f1ea;--gd:#b8923a;--bd:#e6dfc8;--gr:#1d9a5e;--bl:#2d6fd0;--or:#e08a1e;--rd:#d0453b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10201a;--cd:#17302a;--tx:#eef3ee;--mu:#9bb0a5;--g:#3fc08f;--g2:#1d3d33;--gd:#d9b45a;--bd:#2a4a40}}
:root[data-theme=dark]{--bg:#10201a;--cd:#17302a;--tx:#eef3ee;--mu:#9bb0a5;--g:#3fc08f;--g2:#1d3d33;--gd:#d9b45a;--bd:#2a4a40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;line-height:1.7}
header{background:#0f6b4f;background-image:repeating-conic-gradient(#ffffff10 0 25%,transparent 0 50%);background-size:28px 28px;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.25rem}header small{color:#e9d9a6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:8px}nav button{background:#ffffff1f;color:#fff;border:0;border-radius:20px;padding:6px 14px;cursor:pointer;font:inherit;white-space:nowrap}nav button.on{background:#fff;color:#0f6b4f;font-weight:700}
select,input,textarea,button{font:inherit}select,input,textarea{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;max-width:100%}
.demo{background:#fff3cd;color:#664d03;padding:6px 16px;font-size:.85rem;text-align:center}
main{max-width:1050px;margin:0 auto;padding:16px;animation:fi .3s}@keyframes fi{from{opacity:0;transform:translateY(6px)}}

.card h3{margin:0 0 8px;color:var(--g);font-size:1.02rem}.num{font-size:1.8rem;font-weight:700;color:var(--g)}.mu{color:var(--mu);font-size:.85rem}
.bar{height:9px;background:var(--g2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;animation:gw 1s}@keyframes gw{from{width:0}}
.b{display:inline-block;padding:1px 10px;border-radius:12px;font-size:.8rem;color:#fff}.gr{background:var(--gr)}.bl{background:var(--bl)}.or{background:var(--or)}.rd{background:var(--rd)}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:7px 14px;cursor:pointer}.btn.o{background:transparent;color:var(--g);border:1px solid var(--g)}.btn.r{background:var(--rd)}.btn:disabled{opacity:.4;cursor:not-allowed}
.li{padding:8px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.hero{background:linear-gradient(135deg,#0f6b4f,#14805e);color:#fff;border-radius:18px;padding:20px;margin-bottom:14px;border-bottom:4px solid var(--gd)}.hero h2{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}.tile{border:1px solid var(--bd);border-radius:10px;padding:4px;text-align:center;font-size:.78rem;background:var(--cd)}
.tile.f{background:var(--g);color:#fff}.tile.p{background:#f3e3b0;color:#4a3a0a}.tile.w{border:2px solid var(--or)}
.cal{display:flex;gap:4px;flex-wrap:wrap}.cal span{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:.8rem;background:var(--g2)}.cal .d{background:var(--gr);color:#fff}.cal .m{background:var(--rd);color:#fff}.cal .z{opacity:.5}
.rb{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:20;display:grid;gap:6px}#toast div{background:#0f6b4f;color:#fff;padding:8px 16px;border-radius:12px;animation:fi .3s}#toast .e{background:var(--rd)}
.ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:15}.ov .card{max-width:340px}
label{display:block;margin:8px 0 2px;font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="row"><div><h1>🌙 رفيق القرآن</h1><small>رحلة الحفظ والإتقان</small></div>
<label style="margin:0;font-size:.85rem">العرض كـ <select id="who" onchange="who=this.value;go(pg)"></select></label></div><nav id="nav"></nav></header>
<div class="demo">⚠️ وضع تجريبي: البيانات وهمية وتُحفظ في ذاكرة المتصفح فقط، ولا يوجد اتصال بقاعدة بيانات أو تخزين سحابي.</div>
<main id="app"></main><div id="toast"></div>
<script>
const S="الفاتحة:7,البقرة:286,آل عمران:200,النساء:176,المائدة:120,الأنعام:165,الأعراف:206,الأنفال:75,التوبة:129,يونس:109,هود:123,يوسف:111,الرعد:43,إبراهيم:52,الحجر:99,النحل:128,الإسراء:111,الكهف:110,مريم:98,طه:135,الأنبياء:112,الحج:78,المؤمنون:118,النور:64,الفرقان:77,الشعراء:227,النمل:93,القصص:88,العنكبوت:69,الروم:60,لقمان:34,السجدة:30,الأحزاب:73,سبأ:54,فاطر:45,يس:83,الصافات:182,ص:88,الزمر:75,غافر:85,فصلت:54,الشورى:53,الزخرف:89,الدخان:59,الجاثية:37,الأحقاف:35,محمد:38,الفتح:29,الحجرات:18,ق:45,الذاريات:60,الطور:49,النجم:62,القمر:55,الرحمن:78,الواقعة:96,الحديد:29,المجادلة:22,الحشر:24,الممتحنة:13,الصف:14,الجمعة:11,المنافقون:11,التغابن:18,الطلاق:12,التحريم:12,الملك:30,القلم:52,الحاقة:52,المعارج:44,نوح:28,الجن:28,المزمل:20,المدثر:56,القيامة:40,الإنسان:31,المرسلات:50,النبأ:40,النازعات:46,عبس:42,التكوير:29,الانفطار:19,المطففين:36,الانشقاق:25,البروج:22,الطارق:17,الأعلى:19,الغاشية:26,الفجر:30,البلد:20,الشمس:15,الليل:21,الضحى:11,الشرح:8,التين:8,العلق:19,القدر:5,البينة:8,الزلزلة:8,العاديات:11,القارعة:11,التكاثر:8,العصر:3,الهمزة:9,الفيل:5,قريش:4,الماعون:7,الكوثر:3,الكافرون:6,النصر:3,المسد:5,الإخلاص:4,الفلق:5,الناس:6".split(",").map((x,i)=>{const[a,b]=x.split(":");return{id:i+1,n:a,c:+b}});
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=new Date(),D=o=>new Date(T.getFullYear(),T.getMonth(),T.getDate()+o),rest=o=>D(o).getDay()==5;
const wd=(a,b)=>{let n=0;for(let i=a;i<b;i++)if(!rest(i))n++;return n};
const fd=o=>D(o).toLocaleDateString("ar",{day:"numeric",month:"short"});
const NEW="حفظ جديد";
const U=[{id:1,n:"أمينة العلي",pd:10,start:-14,delta:2},{id:2,n:"خديجة سالم",pd:20,start:-10,delta:0},{id:3,n:"مريم حسن",pd:10,start:-14,delta:0},{id:4,n:"فاطمة يوسف",pd:10,start:-12,delta:-2},{id:5,n:"هدى إبراهيم",pd:15,start:-9,delta:1},{id:6,n:"سارة محمود",pd:10,start:-14,delta:-4,hide:1}];
let R=[],RV=[{id:1,u:6,s:2,f:1,t:10,note:"يحتاج إلى تثبيت المقطع"}],nid=1,who="sup",pg="home",rank="new",prefs={ورد:1,تأخر:1,ملاحظات:1};
const REV=[3,2,1,0,2,1];
U.forEach((u,i)=>{u.A=Math.max(0,u.pd*(wd(u.start,0)+u.delta));const days=[];for(let d=u.start;d<=0;d++)if(!rest(d))days.push(d);
for(let k=0;k*u.pd<u.A;k++)R.push({id:nid++,u:u.id,s:2,f:k*u.pd+1,t:Math.min((k+1)*u.pd,u.A),d:days[Math.min(k,days.length-1)],type:NEW,st:"approved",rate:3+(k+i)%3,note:k%4==0?"ما شاء الله، أداء جيد مع الحرص على أحكام المد.":""});
for(let k=0;k<REV[i];k++)R.push({id:nid++,u:u.id,s:1,f:1,t:7,d:-1-k*2,type:"مراجعة",st:"approved",rate:4,note:""})});
[2,3,5].forEach(i=>{const u=U[i-1];R.push({id:nid++,u:i,s:2,f:u.A+1,t:u.A+u.pd,d:0,type:NEW,st:"pending",audio:null})});
const P=u=>U.find(x=>x.id==u);
const mem=(u,from=-999)=>{const s=new Set();R.forEach(r=>{if(r.u==u&&r.st=="approved"&&r.type==NEW&&r.d>=from)for(let v=r.f;v<=r.t;v++)s.add(r.s+":"+v)});return s};
const revN=u=>R.filter(r=>r.u==u&&r.st=="approved"&&r.type!=NEW).reduce((a,r)=>a+r.t-r.f+1,0);
function stt(u){const p=P(u),a=mem(u).size,due=p.pd*wd(p.start,0),tg=p.pd*wd(p.start,1);let o;
if(RV.some(x=>x.u==u))o=["rd","🔴 يحتاج إلى مراجعة","حددت المشرفة مقطعًا يحتاج إلى مراجعة."];
else if(a>tg)o=["gr","🟢 متقدم",`أنجزت ${a} آية معتمدة والمطلوب حتى اليوم ${tg}.`];
else if(a==tg)o=["bl","🔵 على المسار",`أنجزت المطلوب حتى اليوم (${tg} آية).`];
else if(a>=due)o=["bl","🔵 على المسار",`أتممت المطلوب حتى أمس (${due})، وموعد ورد اليوم لم ينتهِ بعد.`];
else o=["or","🟠 متأخر",`المعتمد ${a} والمطلوب حتى أمس ${due} (ينقص ${due-a}).`];
return{k:o[0],l:o[1],r:o[2],a,tg}}
function nxt(u){const p=P(u);let l=null;R.forEach(r=>{if(r.u==u&&r.st=="approved"&&r.type==NEW&&(!l||r.s>l.s||(r.s==l.s&&r.t>l.t)))l=r});
let s=l?l.s:2,f=l?l.t+1:1;if(f>S[s-1].c){s++;f=1}return{s,f,t:Math.min(f+p.pd-1,S[s-1].c)}}
const nx=u=>{const n=nxt(u);return`سورة ${S[n.s-1].n} — المطلوب اليوم: الآيات ${n.f}–${n.t}`};
function streak(u){let n=0,d=0;const h=o=>R.some(r=>r.u==u&&r.st=="approved"&&r.type==NEW&&r.d==o);if(!h(0)&&!rest(0))d=-1;for(;d>-60;d--){if(rest(d))continue;if(h(d))n++;else break}return n}
function met(u){const p=P(u),s=stt(u),pc=(w,from)=>Math.min(100,Math.round(mem(u,w).size/Math.max(1,p.pd*wd(Math.max(w,p.start),1))*100));
return{new:s.a,ad:Math.min(100,Math.round(s.a/Math.max(1,s.tg)*100)),rv:revN(u),wk:pc(-6),mo:pc(-29)}}
const bar=(p,c)=>`<div class="bar"><i style="width:${p}%${c?";background:var(--"+c+")":""}"></i></div>`;
const bdg=s=>`<span class="b ${s.k}">${s.l}</span>`;
const isSup=()=>who=="sup",me=()=>+who,vis=u=>!P(u).hide||isSup()||me()==u;
const nm=u=>vis(u)?P(u).n:"مشارك مخفي";
function toast(m,e){save();const d=document.createElement("div");d.textContent=m;if(e)d.className="e";$("#toast").append(d);setTimeout(()=>d.remove(),3500)}
function ask(m){return new Promise(r=>{const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="card"><p>${m}</p><div class="rb"><button class="btn r" id="y">تأكيد</button><button class="btn o" id="n">إلغاء</button></div></div>`;document.body.append(o);o.querySelector("#y").onclick=()=>{o.remove();r(1)};o.querySelector("#n").onclick=()=>{o.remove();r(0)}})}
const ranked=k=>U.map(u=>({u:u.id,m:met(u.id)})).sort((a,b)=>b.m[k]-a.m[k]||b.m.new-a.m.new);
const unit={new:" آية",ad:"%",rv:" آية",wk:"%",mo:"%"};
const RN={new:"الحفظ الجديد المعتمد",ad:"الالتزام بالخطة",rv:"المراجعة المنتظمة",wk:"الإنجاز الأسبوعي",mo:"الإنجاز الشهري"};
const medal=i=>["🥇","🥈","🥉"][i]||i+1;
function lb(k,n){return ranked(k).slice(0,n||99).map((x,i)=>`<div class="li row"><span>${medal(i)} ${esc(nm(x.u))}</span><b>${x.m[k]}${unit[k]}</b></div>`).join("")}
function pages(){return isSup()?{home:"الرئيسية",follow:"متابعة المشاركين",queue:"طابور المراجعة",board:"لوحة الشرف",notif:"الإشعارات",manage:"إدارة البيانات"}:{home:"الرئيسية",mine:"لوحتي",track:"سجل الحفظ",rec:"تسميع جديد",board:"لوحة الشرف",notif:"الإشعارات"}}
function go(p){const m=pages();pg=m[p]?p:"home";$("#nav").innerHTML=Object.entries(m).map(([k,v])=>`<button class="${k==pg?"on":""}" onclick="go('${k}')">${v}${k=="queue"?" ("+R.filter(r=>r.st=="pending").length+")":""}</button>`).join("");
$("#app").innerHTML=({home,follow,queue,board,notif,mine,track,manage,rec:recPage})[pg]();save();$("#app").style.animation="none";$("#app").offsetWidth;$("#app").style.animation="";if(pg=="rec")recUI(),sChg()}
function home(){const g=(isSup()?U.map(u=>u.id):[me()]);const all=U.map(u=>stt(u.id));
const done=U.reduce((a,u)=>a+mem(u.id).size,0),av=Math.round(U.reduce((a,u)=>a+met(u.id).ad,0)/Math.max(1,U.length)),late=U.filter(u=>stt(u.id).k=="or");
return`<div class="hero"><h2>رفيق القرآن</h2><p>رحلتك مع القرآن تبدأ بآية 🌿</p>${isSup()?"<p>أهلًا بكِ يا أستاذة، لديك "+R.filter(r=>r.st=="pending").length+" تسميعات بانتظار المراجعة.</p>":`<p><b>ورد اليوم:</b> ${nx(me())}</p><button class="btn" style="background:var(--gd)" onclick="go('rec')">🎙️ سجّل تسميعك</button>`}</div>
<div class="grid st"><div class="card"><div class="mu">المشاركون</div><div class="num">${U.length}</div></div><div class="card"><div class="mu">جلسات التسميع</div><div class="num">${R.length}</div></div><div class="card"><div class="mu">آيات منجزة (معتمدة)</div><div class="num">${done}</div></div><div class="card"><div class="mu">الالتزام بالخطة</div><div class="num">${av}%</div></div><div class="card"><div class="mu">أيام الاستمرار</div><div class="num">${isSup()?Math.max(0,...U.map(u=>streak(u.id))):streak(me())}</div></div></div><br>
<div class="grid"><div class="card"><h3>تقدم حلقة التحفيظ</h3>${U.map(u=>{const s=stt(u.id);return`<div class="li"><div class="row"><span>${esc(nm(u.id))}</span>${bdg(s)}</div>${bar(Math.min(100,Math.round(s.a/Math.max(1,s.tg)*100)),s.k)}</div>`}).join("")}</div>
<div class="card"><h3>آخر جلسات التسميع</h3>${[...R].sort((a,b)=>b.d-a.d||b.id-a.id).slice(0,6).map(r=>`<div class="li">${esc(nm(r.u))} — ${S[r.s-1].n} ${r.f}–${r.t}<br><span class="mu">${r.type} • ${fd(r.d)} • ${{approved:"معتمد",pending:"بانتظار التقييم",rejected:"مرفوض"}[r.st]}</span></div>`).join("")}</div>
<div class="card"><h3>ترتيب المشاركين</h3>${lb("new",3)}</div><div class="card"><h3>المشاركون الأكثر التزامًا</h3>${lb("ad",3)}</div>
<div class="card"><h3>الأشخاص المتأخرون عن الخطة</h3>${late.length?late.map(u=>`<div class="li">${esc(nm(u.id))}<br><span class="mu">${stt(u.id).r}</span></div>`).join(""):"<p class='mu'>لا يوجد متأخرون 🎉</p>"}</div>
<div class="card"><h3>ورد اليوم</h3>${g.map(u=>`<div class="li">${isSup()?esc(nm(u))+": ":""}${nx(u)}</div>`).join("")}<p class="mu">لم يُدرج نص القرآن في هذه النسخة؛ يُوصى بربط مصدر نصّي موثوق ومعتمد.</p></div></div>`}
function mine(){const u=me(),s=stt(u),m=met(u),n=mem(u),cnt={};n.forEach(k=>{const i=k.split(":")[0];cnt[i]=(cnt[i]||0)+1});
const full=S.filter(x=>cnt[x.id]==x.c),l=R.filter(r=>r.u==u&&r.st=="approved"&&r.type==NEW).sort((a,b)=>b.s-a.s||b.t-a.t)[0];
const cal=[];for(let d=-13;d<=0;d++){const h=R.some(r=>r.u==u&&r.st=="approved"&&r.type==NEW&&r.d==d);cal.push(`<span class="${rest(d)?"z":h?"d":d==0?"":"m"}" title="${fd(d)}">${rest(d)?"·":h?"✓":d==0?"…":"✗"}</span>`)}
return`<div class="grid"><div class="card"><h3>حالتي</h3>${bdg(s)}<p>${s.r}</p><p><b>${nx(u)}</b></p></div>
<div class="card"><h3>إنجازي</h3><div class="num">${s.a}</div><div class="mu">آية محفوظة ومعتمدة • مراجعة منفصلة: ${m.rv}</div><p>سور مكتملة: ${full.length?full.map(x=>x.n).join("، "):"لا يوجد بعد"}<br>آخر موضع: ${l?S[l.s-1].n+" آية "+l.t:"—"}</p></div>
<div class="card"><h3>الخطة</h3><div class="mu">الأسبوعي ${m.wk}%</div>${bar(m.wk)}<div class="mu">الشهري ${m.mo}%</div>${bar(m.mo)}<p class="mu">${P(u).pd} آيات/يوم، الجمعة راحة</p></div></div><br>
<div class="grid"><div class="card"><h3>سجل الالتزام (14 يومًا)</h3><div class="cal">${cal.join("")}</div><p class="mu">✓ منجز • ✗ فائت • … اليوم • · راحة</p></div>
<div class="card"><h3>مقاطع تحتاج مراجعة</h3>${RV.filter(x=>x.u==u).map(x=>`<div class="li">${S[x.s-1].n} ${x.f}–${x.t}<br><span class="mu">${esc(x.note)}</span></div>`).join("")||"<p class='mu'>لا يوجد</p>"}</div>
<div class="card"><h3>تسجيلاتي وتقييماتي</h3>${R.filter(r=>r.u==u).sort((a,b)=>b.d-a.d).slice(0,8).map(r=>`<div class="li">${S[r.s-1].n} ${r.f}–${r.t} (${r.type}) ${r.st=="pending"?"⏳":r.st=="rejected"?"❌":"⭐".repeat(r.rate||0)}<br>${r.audio?`<audio controls src="${r.audio}" style="width:100%"></audio>`:""}${r.note?`<span class="mu">${esc(r.note)}</span>`:""}</div>`).join("")}</div>
